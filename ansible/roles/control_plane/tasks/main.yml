---
- name: Initialize Kubernetes cluster
  command:
    cmd: kubeadm init --pod-network-cidr={{ pod_network_cidr }}
    creates: /etc/kubernetes/admin.conf

- name: Create kube config directory
  file:
    path: /home/{{ ansible_user }}/.kube
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copy admin.conf to user kube config
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/{{ ansible_user }}/.kube/config
    remote_src: yes
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Check if Calico already installed
  command:
    cmd: kubectl get daemonset calico-node -n kube-system
  environment:
    KUBECONFIG: /home/{{ ansible_user }}/.kube/config
  register: calico_check
  failed_when: false
  changed_when: false

- name: Install Calico CNI
  become_user: "{{ ansible_user }}"
  command:
    cmd: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.27.0/manifests/calico.yaml
  environment:
    KUBECONFIG: /home/{{ ansible_user }}/.kube/config
  when: calico_check.rc != 0

- name: Generate kubeadm join command
  command:
    cmd: kubeadm token create --print-join-command
  register: join_command
  changed_when: false

- name: Save join command
  copy:
    content: "{{ join_command.stdout }}"
    dest: /tmp/kubeadm_join_cmd.sh
    mode: '0755'