--- 
- name: Update apt packages 
  apt: 
    update_cache: yes 

- name: Disable swap immediately
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Disable swap permanently in fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
    replace: '# \1'
    
- name: Load kernel modules 
  copy: 
    dest: /etc/modules-load.d/k8s.conf 
    content: | 
      overlay 
      br_netfilter 

- name: Load overlay module
  command: modprobe overlay

- name: Load br_netfilter module
  command: modprobe br_netfilter

      
- name: Configure sysctl 
  copy: 
    dest: /etc/sysctl.d/k8s.conf 
    content: | 
      net.bridge.bridge-nf-call-iptables = 1 
      net.bridge.bridge-nf-call-ip6tables = 1 
      net.ipv4.ip_forward = 1 
        
- name: Apply sysctl 
  command: sysctl --system 
    
- name: Install dependencies 
  apt: 
    name: 
      - apt-transport-https 
      - ca-certificates 
      - curl 
      - gpg 
    state: present 

- name: Create keyrings directory 
  file: 
    path: /etc/apt/keyrings 
    state: directory 
        
- name: Download Kubernetes GPG key
  get_url:
    url: https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key
    dest: /tmp/kubernetes-release.key
    mode: '0644'

- name: Convert Kubernetes GPG key
  command:
    cmd: gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes-release.key
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Add Kubernetes repository
  copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: |
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.29/deb/ / 

- name: Install containerd 
  apt: 
    name: containerd 
    state: present 

- name: Create containerd config directory
  file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Generate default containerd config
  command:
    cmd: containerd config default
  register: containerd_config
  changed_when: false

- name: Write containerd config
  copy:
    dest: /etc/containerd/config.toml
    content: "{{ containerd_config.stdout }}"
    mode: '0644'

- name: Enable systemd cgroup driver
  replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'

- name: Restart containerd 
  service: 
    name: containerd 
    state: restarted 
    enabled: yes 
      
- name: Install Kubernetes packages 
  apt: 
    update_cache: yes 
    name: 
      - kubelet 
      - kubeadm 
      - kubectl 
    state: present 
        
- name: Hold Kubernetes packages 
  dpkg_selections: 
    name: "{{ item }}" 
    selection: hold 
  loop: 
      - kubelet 
      - kubeadm 
      - kubectl