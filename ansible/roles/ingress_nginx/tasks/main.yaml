---
- name: Install NGINX Ingress Controller
  command:
    cmd: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.2/deploy/static/provider/baremetal/deploy.yaml
  environment:
    KUBECONFIG: /home/{{ ansible_user }}/.kube/config

- name: Wait for NGINX Ingress Controller
  command:
    cmd: kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=300s
  environment:
    KUBECONFIG: /home/{{ ansible_user }}/.kube/config

- name: Enable hostNetwork for ingress-nginx
  command:
    cmd: >
      kubectl patch deployment ingress-nginx-controller
      -n ingress-nginx
      --type='merge'
      -p '{"spec":{"template":{"spec":{"hostNetwork":true,"dnsPolicy":"ClusterFirstWithHostNet"}}}}'
  environment:
    KUBECONFIG: /home/{{ ansible_user }}/.kube/config

- name: Restart ingress controller
  command:
    cmd: kubectl rollout restart deployment ingress-nginx-controller -n ingress-nginx
  environment:
    KUBECONFIG: /home/{{ ansible_user }}/.kube/config
    